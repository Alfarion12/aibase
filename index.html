/* ============================================================
   SoulArk AI Landing — styles (v3 — white-heavy, conversion-first)
   ============================================================ */




:root {
  --color-bg:           #FFFFFF;
  --color-fg1:          #0B1E33;
  --color-fg2:          #3A516A;
  --color-fg3:          #8893A0;
  --color-accent:       #FF8C42;
  --color-accent-hover: #F07A2E;
  --color-accent-soft:  #FFF4EA;
  --color-champagne:    #FAE5BE;
  --color-champagne-bg: #FDF6E5;
  --color-border:       rgba(11, 30, 51, 0.08);
  --color-border-2:     rgba(11, 30, 51, 0.12);
  --color-divider:      rgba(11, 30, 51, 0.06);

  --shadow-card:        0 1px 2px rgba(11,30,51,0.04), 0 4px 14px rgba(11,30,51,0.05);

  --radius-sm: 8px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-pill: 999px;

  --font-heading: 'Gilroy', 'Inter', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--color-bg);
  color: var(--color-fg1);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

/* ============== LAYOUT ============== */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: #fff;
}

.shell {
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  padding: 14px 14px 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
@media (min-width: 720px) {
  .shell { padding: 24px 20px 28px; gap: 18px; }
}

/* ============== TOP TAG (small champagne chip) ============== */
.tag-strip {
  display: inline-flex;
  align-self: flex-start;
  align-items: center;
  gap: 6px;
  background: var(--color-champagne-bg);
  border: 1px solid rgba(250, 229, 190, 0.9);
  border-radius: var(--radius-pill);
  padding: 6px 12px;
  font-size: 12px;
  color: var(--color-fg2);
  font-weight: 500;
}
.tag-strip .wink { font-size: 13px; }
@media (min-width: 540px) {
  .tag-strip { font-size: 13px; padding: 7px 14px; }
}

/* ============== HERO (white, 2-col: text+benefits LEFT, photo RIGHT) ============== */
.hero {
  display: grid;
  grid-template-columns: 2.2fr 1fr;
  gap: 10px;
  align-items: stretch;
}
@media (min-width: 540px) {
  .hero { grid-template-columns: 1.6fr 1fr; gap: 16px; }
}
@media (min-width: 720px) {
  .hero { grid-template-columns: 1.6fr 1fr; gap: 20px; }
}

.hero-left {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
}

.hero-title {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 17px;
  line-height: 1.15;
  color: var(--color-accent);
  margin: 0;
  letter-spacing: -0.02em;
}
@media (min-width: 540px) {
  .hero-title { font-size: 20px; letter-spacing: -0.01em; }
}
@media (min-width: 720px) {
  .hero-title { font-size: 24px; }
}

.hero-sub {
  font-size: 13px;
  line-height: 1.45;
  color: var(--color-fg1);
  margin: 0 0 4px;
  font-weight: 500;
}
@media (min-width: 540px) { .hero-sub { font-size: 14px; } }
@media (min-width: 720px) { .hero-sub { font-size: 15px; } }
.hero-sub .em { color: var(--color-accent); font-weight: 700; }

.hero-photo {
  position: relative;
  border-radius: var(--radius-md);
  background: #F4F6FA;
  display: flex;
  align-items: stretch;
  justify-content: center;
  overflow: hidden;
  width: 100%;
  height: 100%;
  min-height: 220px;
}
.hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 50% 15%;
}
.hero-photo-caption {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 5px 6px;
  font-size: 10px;
  line-height: 1.2;
  color: #fff;
  background: linear-gradient(180deg, rgba(11,30,51,0) 0%, rgba(11,30,51,0.6) 50%, rgba(11,30,51,0.75) 100%);
  text-align: center;
  font-weight: 500;
  letter-spacing: -0.005em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
@media (min-width: 540px) {
  .hero-photo-caption { font-size: 11px; padding: 8px 10px; letter-spacing: 0; }
}
.hp-cap-long { display: none; }
@media (min-width: 540px) {
  .hp-cap-short { display: none; }
  .hp-cap-long  { display: inline; }
}
.hero-photo-inner {
  text-align: center;
  color: var(--color-fg3);
  padding: 8px;
}
.hero-photo-inner .ic {
  width: 28px; height: 28px;
  margin: 0 auto 6px;
  color: var(--color-fg3);
  opacity: 0.7;
}
.hero-photo-inner .ttl {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 11px;
  color: var(--color-fg2);
  margin-bottom: 2px;
  letter-spacing: 0.02em;
}
.hero-photo-inner .sub {
  font-size: 10px;
  color: var(--color-fg3);
  line-height: 1.3;
}
@media (min-width: 540px) {
  .hero-photo-inner .ttl { font-size: 12px; }
  .hero-photo-inner .sub { font-size: 11px; }
  .hero-photo-inner .ic { width: 32px; height: 32px; }
}

/* ============== BENEFITS (white, thin orange left bar) ============== */
.benefits {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 4px;
}

.benefit {
  background: #fff;
  border: 1px solid var(--color-border);
  border-left: 3px solid var(--color-accent);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  display: flex;
  gap: 9px;
  align-items: flex-start;
}
.benefit-icon {
  flex-shrink: 0;
  width: 22px; height: 22px;
  color: var(--color-accent);
  margin-top: 1px;
}
.benefit-body { min-width: 0; }
.benefit-title {
  font-family: var(--font-heading);
  font-weight: 800;
  font-size: 12px;
  line-height: 1.2;
  color: var(--color-fg1);
  margin: 0 0 2px;
}
.benefit-text {
  font-size: 11px;
  line-height: 1.4;
  color: var(--color-fg2);
  margin: 0;
}
@media (min-width: 540px) {
  .benefit { padding: 10px 12px; gap: 10px; }
  .benefit-title { font-size: 13px; }
  .benefit-text { font-size: 12px; }
}
@media (min-width: 720px) {
  .benefit-title { font-size: 14px; }
  .benefit-text { font-size: 13px; }
  .benefit-icon { width: 24px; height: 24px; }
}

/* ============== QUIZ INTRO ============== */
.quiz-intro {
  font-size: 11px;
  line-height: 1.4;
  color: var(--color-fg1);
  padding: 6px 2px 2px;
  font-weight: 500;
  letter-spacing: -0.005em;
  white-space: nowrap;
  overflow: hidden;
}
@media (min-width: 540px) { .quiz-intro { font-size: 14px; letter-spacing: 0; } }
@media (min-width: 720px) { .quiz-intro { font-size: 16px; } }
.quiz-intro .accent {
  background: var(--color-accent);
  color: #fff;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 0;
  white-space: nowrap;
  display: inline-block;
  margin-right: 4px;
  letter-spacing: 0;
}
@media (min-width: 540px) {
  .quiz-intro .accent { padding: 3px 8px; }
}

/* ============== QUIZ CARD ============== */
.quiz {
  background: #fff;
  border: 1px solid var(--color-border-2);
  border-radius: var(--radius-lg);
  padding: 0;
  box-shadow: var(--shadow-card);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.quiz-progress {
  height: 3px;
  background: var(--color-accent-soft);
  position: relative;
}
.quiz-progress-fill {
  position: absolute;
  inset: 0 auto 0 0;
  background: var(--color-accent);
  transition: width 320ms ease;
}

.quiz-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
@media (min-width: 720px) {
  .quiz-body { padding: 22px; gap: 16px; }
}

/* Less heavy question text */
.quiz-question {
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 15px;
  line-height: 1.3;
  color: var(--color-fg1);
  margin: 0;
  letter-spacing: -0.005em;
}
@media (min-width: 720px) {
  .quiz-question { font-size: 17px; }
}

.options {
  display: grid;
  grid-template-columns: 1fr;
  gap: 7px;
}
@media (min-width: 540px) {
  .options.cols-2 { grid-template-columns: 1fr 1fr; }
}

.option {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 13px;
  background: #fff;
  border: 1.5px solid var(--color-border-2);
  border-radius: var(--radius-md);
  font-size: 14px;
  color: var(--color-fg1);
  text-align: left;
  transition: all 160ms ease;
  font-family: inherit;
}
.option:hover {
  border-color: var(--color-accent);
  background: var(--color-accent-soft);
}
.option.is-selected {
  border-color: var(--color-accent);
  background: var(--color-accent-soft);
}
.option-radio {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 1.5px solid var(--color-border-2);
  flex-shrink: 0;
  position: relative;
  transition: all 160ms ease;
}
.option.is-selected .option-radio { border-color: var(--color-accent); }
.option.is-selected .option-radio::after {
  content: "";
  position: absolute;
  inset: 3px;
  background: var(--color-accent);
  border-radius: 50%;
}

/* Phone input */
.phone-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.phone-input {
  width: 100%;
  padding: 13px 16px;
  font-size: 16px;
  font-family: inherit;
  color: var(--color-fg1);
  border: 1.5px solid var(--color-border-2);
  border-radius: var(--radius-md);
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease;
  background: #fff;
}
.phone-input::placeholder { color: #B7BFC9; }
.phone-input:focus {
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px rgba(255,140,66,0.12);
}
.phone-hint {
  font-size: 11px;
  color: var(--color-fg3);
  display: flex;
  align-items: center;
  gap: 5px;
}

/* Quiz nav */
.quiz-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-top: 2px;
}
.quiz-step-label {
  font-size: 12px;
  color: var(--color-fg3);
  font-weight: 500;
}
.quiz-nav-right { display: flex; gap: 8px; align-items: center; }

.btn-back {
  width: 40px;
  height: 40px;
  border-radius: var(--radius-md);
  border: 1.5px solid var(--color-border-2);
  background: #fff;
  color: var(--color-fg2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 160ms ease;
}
.btn-back:hover:not(:disabled) {
  border-color: var(--color-accent);
  color: var(--color-accent);
}

const UTM = (function(){var p=new URLSearchParams(window.location.search);return{utm_source:p.get("utm_source")||"",utm_medium:p.get("utm_medium")||"",utm_campaign:p.get("utm_campaign")||"",utm_content:p.get("utm_content")||"",utm_term:p.get("utm_term")||""};})();

const Icon = ({ name, size = 24, stroke = 1.75, className = "" }) => {

    default:

};

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// QUIZ DATA
// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
const QUIZ_STEPS = [
  {
    id: "problem",
    question: "\u041a\u0430\u043a\u0430\u044f \u0433\u043b\u0430\u0432\u043d\u0430\u044f \u043f\u0440\u043e\u0431\u043b\u0435\u043c\u0430 \u0441 \u043a\u043e\u043c\u0430\u043d\u0434\u043e\u0439 \u043f\u0440\u044f\u043c\u043e \u0441\u0435\u0439\u0447\u0430\u0441?",
    type: "single",
    cols: 1,
    options: [
      "\u0421\u043b\u0438\u0432\u0430\u044e\u0442 \u0441\u0434\u0435\u043b\u043a\u0438 \u2014 \u043d\u0430\u0432\u044b\u043a\u043e\u0432 \u043d\u0435 \u0445\u0432\u0430\u0442\u0430\u0435\u0442",
      "\u0420\u0435\u0437\u0443\u043b\u044c\u0442\u0430\u0442 \u0437\u0432\u043e\u043d\u043a\u043e\u0432 \u043d\u0435\u043f\u0440\u0435\u0434\u0441\u043a\u0430\u0437\u0443\u0435\u043c",
      "\u041d\u043e\u0432\u0438\u0447\u043a\u0438 \u0434\u043e\u043b\u0433\u043e \u0432\u044b\u0445\u043e\u0434\u044f\u0442 \u043d\u0430 \u043f\u043b\u0430\u043d",
      "\u0420\u041e\u041f \u0442\u043e\u043d\u0435\u0442 \u0432 \u0440\u0443\u0447\u043d\u043e\u043c \u043a\u043e\u043d\u0442\u0440\u043e\u043b\u0435",
    ],
  },
  {
    id: "team_size",
    question: "\u0421\u043a\u043e\u043b\u044c\u043a\u043e \u043c\u0435\u043d\u0435\u0434\u0436\u0435\u0440\u043e\u0432 \u0437\u0432\u043e\u043d\u044f\u0442 \u0432 \u0432\u0430\u0448\u0435\u043c \u043e\u0442\u0434\u0435\u043b\u0435?",
    type: "single",
    cols: 2,
    options: ["1\u20132", "3\u20135", "6\u201310", "11+"],
  },
  {
    id: "avg_check",
    question: "\u041a\u0430\u043a\u043e\u0439 \u043f\u0440\u0438\u043c\u0435\u0440\u043d\u044b\u0439 \u0441\u0440\u0435\u0434\u043d\u0438\u0439 \u0447\u0435\u043a \u0432\u0430\u0448\u0435\u0439 \u0441\u0434\u0435\u043b\u043a\u0438?",
    type: "single",
    cols: 1,
    options: ["\u0434\u043e 50 \u0442.\u0440.", "50 \u2013 200 \u0442.\u0440.", "\u0431\u043e\u043b\u0435\u0435 200 \u0442.\u0440."],
  },
  {
    id: "channel",
    question: "\u0413\u0434\u0435 \u0443\u0434\u043e\u0431\u043d\u0435\u0435 \u043f\u043e\u043b\u0443\u0447\u0438\u0442\u044c \u0440\u0430\u0441\u0447\u0451\u0442 \u0443\u043f\u0443\u0449\u0435\u043d\u043d\u043e\u0439 \u0432\u044b\u0440\u0443\u0447\u043a\u0438?",
    type: "single",
    cols: 2,
    options: ["Telegram", "MAX", "WhatsApp"],
  },
  {
    id: "phone",
    question: "\u0422\u0435\u043b\u0435\u0444\u043e\u043d",
    type: "phone",
  },
];

// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
// QUIZ COMPONENT
// \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function Quiz() {
  const [stepIdx, setStepIdx] = useState(0);
  const [answers, setAnswers] = useState({});
  const [phone, setPhone] = useState("+7 ");
  const [done, setDone] = useState(false);
  const advanceTimer = React.useRef(null);

  React.useEffect(() => () => clearTimeout(advanceTimer.current), []);

  const step = QUIZ_STEPS[stepIdx];
  const total = QUIZ_STEPS.length;
  const isLast = stepIdx === total - 1;

  function canAdvance() {
    if (!step) return false;
    if (step.type === "phone") return phone.replace(/\D/g, "").length >= 11;
    return Boolean(answers[step.id]);
  }
  const ready = canAdvance();

  const progress = done ? 100 : ((stepIdx + (ready ? 1 : 0.4)) / total) * 100;

  function goNext() {
    if (stepIdx < total - 1) {
      setStepIdx(stepIdx + 1);
    } else {
      fetch(SHEET_URL, {
        method: "POST",
        body: JSON.stringify({ timestamp: new Date().toISOString(), ...answers, phone, ...UTM }),
      }).catch(() => {});
      if (window.ym) ym(109371472, 'reachGoal', 'quiz_submit');
      setDone(true);
    }
  }

  function selectOption(opt) {
    setAnswers((a) => ({ ...a, [step.id]: opt }));
    // Auto-advance after a short beat
    clearTimeout(advanceTimer.current);
    advanceTimer.current = setTimeout(() => goNext(), 280);
  }

  function next() {
    if (!ready) return;
    goNext();
  }
  function back() { if (stepIdx > 0) setStepIdx(stepIdx - 1); }

  function onPhoneChange(e) {
    let raw = e.target.value.replace(/\D/g, "");
    if (raw.startsWith("8")) raw = "7" + raw.slice(1);
    if (!raw.startsWith("7")) raw = "7" + raw;
    raw = raw.slice(0, 11);
    let f = "+7";
    if (raw.length > 1) f += " (" + raw.slice(1, 4);
    if (raw.length >= 4) f += ") " + raw.slice(4, 7);
    if (raw.length >= 7) f += "-" + raw.slice(7, 9);
    if (raw.length >= 9) f += "-" + raw.slice(9, 11);
    setPhone(f);
  }

  if (done) {
    return (
      <section className="quiz" id="quiz">
        <div className="quiz-progress"><div className="quiz-progress-fill" style={{ width: "100%" }} /></div>
        <div className="quiz-body">
          <div className="quiz-success">
            <div className="quiz-success-icon"><Icon name="check" size={28} stroke={2.25} /></div>
            <h3>{"\u0417\u0430\u044f\u0432\u043a\u0430 \u043e\u0442\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0430"}</h3>
            <p>{"\u041f\u0430\u0432\u0435\u043b \u0441\u0432\u044f\u0436\u0435\u0442\u0441\u044f \u0441 \u0432\u0430\u043c\u0438 \u0432 \u0442\u0435\u0447\u0435\u043d\u0438\u0435 \u0447\u0430\u0441\u0430 \u0438 \u0441\u0434\u0435\u043b\u0430\u0435\u0442 \u0440\u0430\u0441\u0447\u0451\u0442 \u0443\u043f\u0443\u0449\u0435\u043d\u043d\u043e\u0439 \u0432\u044b\u0440\u0443\u0447\u043a\u0438 \u043f\u043e\u0434 \u0432\u0430\u0448 \u043e\u0442\u0434\u0435\u043b."}</p>
          </div>
        </div>
      </section>
    );
  }

  return (
    <section className="quiz" id="quiz">
      <div className="quiz-progress">
        <div className="quiz-progress-fill" style={{ width: progress + "%" }} />
      </div>

      <div className="quiz-body">
        <h3 className="quiz-question">{step.question}</h3>

        {step.type === "single" && (
          <div className={"options " + (step.cols === 2 ? "cols-2" : "")}>
            {step.options.map((opt) => {
              const selected = answers[step.id] === opt;
              return (
                <button
                  key={opt}
                  type="button"
                  className={"option" + (selected ? " is-selected" : "")}
                  onClick={() => selectOption(opt)}
                >
                  <span className="option-radio" />
                  <span>{opt}</span>
                </button>
              );
            })}
          </div>
        )}

        {step.type === "phone" && (
          <div className="phone-field">
            <input
              type="tel"
              inputMode="tel"
              className="phone-input"
              placeholder="+7 (___) ___-__-__"
              value={phone}
              onChange={onPhoneChange}
              autoComplete="tel"
            />
          </div>
        )}

        <div className="quiz-nav">
          <div className="quiz-step-label">{"Шаг"} {stepIdx + 1}/{total}</div>
          <div className="quiz-nav-right">
            <button type="button" className="btn-back" onClick={back} disabled={stepIdx === 0} aria-label={"\u041d\u0430\u0437\u0430\u0434"}>
              <Icon name="arrow-left" size={18} />
            </button>
            <button type="button" className="btn-next" onClick={next} disabled={!ready}>
              {isLast ? "\u041e\u0442\u043f\u0440\u0430\u0432\u0438\u0442\u044c" : "\u0414\u0430\u043b\u0435\u0435"}
              <Icon name="arrow" size={16} />
            </button>
          </div>
        </div>
      </div>
    </section>
  );
}
